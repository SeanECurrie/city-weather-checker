name: Refresh weather
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/refresh.py
        env:
          OWM_KEY: ${{ secrets.OWM_KEY }}
      - run: |
          git config user.name "weather-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh weather"
          git push
